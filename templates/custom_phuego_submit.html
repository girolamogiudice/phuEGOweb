[[extend "layout.html"]]

<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-half">

        <!-- Title -->
        <h1 class="title has-text-centered">New Submission</h1>
        <p class="subtitle has-text-centered">
          Configure your analysis parameters below.
        </p>

        <!-- Info message -->
        <div class="notification is-info has-text-centered">
            [[=message]]
        </div>

        <!-- Form box -->
        <div class="box">
          [[=form]]
        </div>

      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const RESNIK_NETWORK = "IntAct_045_resnik";
  const network = document.querySelector('select[name="network_type"], select[name$=".network_type"], select[name$="_network_type"]');
  const kde = document.querySelector('select[name="kde_probability"], select[name$=".kde_probability"], select[name$="_kde_probability"]');
  if (!network || !kde) return;

  const optimalOption = Array.from(kde.options).find(option => option.value === "Optimal");
  const optimalTemplate = optimalOption ? optimalOption.cloneNode(true) : new Option("Optimal", "Optimal");

  function syncKdeOptions() {
    const allowOptimal = network.value === RESNIK_NETWORK;
    const currentOptimal = Array.from(kde.options).find(option => option.value === "Optimal");

    if (allowOptimal && !currentOptimal) {
      kde.insertBefore(optimalTemplate.cloneNode(true), kde.firstChild);
    }

    if (!allowOptimal && currentOptimal) {
      if (kde.value === "Optimal") kde.value = "0.85";
      currentOptimal.remove();
    }
  }

  network.addEventListener("change", syncKdeOptions);
  syncKdeOptions();
})();
</script>
