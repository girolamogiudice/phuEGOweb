[[extend "layout.html"]]

<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-half">

        <!-- Title -->
        <h1 class="title has-text-centered">Retrieve Results</h1>
        <p class="subtitle has-text-centered">
          Enter the UUID of a previous phuEGO run.
        </p>

        <!-- Info message -->
        <div class="notification is-info has-text-centered">
          [[=message]]
        </div>

        <!-- Form box -->
        <div class="box">
          [[=form]]
        </div>

      </div>
    </div>
  </div>
</section>
